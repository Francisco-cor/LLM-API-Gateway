openapi: 3.1.0
info:
  title: LLM API Gateway
  version: 1.1.1
  summary: OpenAI-compatible gateway for OpenAI, Anthropic and Gemini.
  description: |
    Contract for the gateway's public HTTP surface and its admin API.

    This document is gated in CI: Redocly must report zero problems and
    `oasdiff breaking` must find no incompatible change against the previous
    published revision. Wire compatibility is also exercised with the official
    OpenAI Python and Node SDKs; see `tests/conformance/`.

    **Base URLs.** The data plane listens on `:8080`; the admin API listens on
    `:8081` and defaults to `127.0.0.1`. Every admin operation overrides the
    server to the admin listener.

    **Authentication.** Tenant endpoints require `Authorization: Bearer <key>`
    only when `auth.enabled` is true. Keys must declare at least one allowed
    scope (`chat:write`, `embeddings:write`, `models:read`, `admin:write`,
    `resource:<name>`, `*`); a route without an explicit scope mapping is
    denied. The admin API accepts either a Bearer token or
    `X-Admin-API-Key`. Config validation refuses to start when
    `admin.allow_insecure` is false and no admin key is configured; if the
    admin handler is somehow wired without a key, it returns `503` instead of
    serving the control plane. `--strict`/`GATEWAY_ENV=prod` additionally
    requires auth, an admin key, pprof off, no wildcard CORS and https
    provider URLs.

    **Limits and decoding.** Chat and embeddings bodies are capped at **8 MiB**
    (vision/audio); larger bodies get `413`. Admin patches are capped at 1 MiB.
    Exactly one JSON value per request body is accepted. The **data plane
    tolerates unknown JSON fields** (OpenAI adds fields over time) and ignores
    them; the control plane (YAML config, admin) remains strict. Upstream
    responses are capped at 8 MiB.

    **Validation scope.** The gateway itself validates the JSON shape, required
    `model`/`messages`, non-empty embedding `input`, body size, and the
    capabilities of the resolved model. Numeric ranges, enums and
    provider-specific combinations in this schema describe the expected OpenAI
    shape; they are forwarded to the provider and may be rejected upstream
    with `400`/`502` rather than by the gateway.

    **Capabilities.** Models expose `chat`, `stream`, `tools`,
    `parallel_tools`, `vision`, `audio`, `json_object`, `json_schema` and
    `embeddings`. A request that needs tools, vision, audio or structured
    output is rejected with `400 model_capability_mismatch` before any provider
    call when the resolved model cannot serve it. Fallback skips models that
    would lose a required capability instead of silently degrading the
    response.

    **Idempotency.** `POST /v1/chat/completions` and `POST /v1/embeddings`
    accept an optional `Idempotency-Key` header when `idempotency.enabled` is
    true. A successful response is stored for `idempotency.ttl` and replayed
    for the same key and byte-identical body (with `Idempotent-Replayed: true`);
    reusing the key with a different body returns `409 idempotency_key_reuse`.
    Concurrent duplicates wait for the leader; if it does not finish within
    `idempotency.wait_timeout` the duplicate gets `409
    idempotency_in_progress`. Streaming requests bypass idempotency.

    **Error mapping.** Upstream 400/422 → `400`; 404 → `404`; 413 → `413`;
    429 → `429`; 401/403 → `502`; 503/504 → `503`; other 5xx/network → `502`.
    `Retry-After` is rounded up to a whole second and never below 1.

    **Durations in the admin config.** `GET /admin/config` serializes the Go
    config structs with their default JSON encoding: field names are
    capitalized (`Admin.APIKey`, `Server.Port`) and `time.Duration` values are
    integer nanoseconds. `PATCH /admin/config` accepts duration strings such as
    `"30s"` or `"5m"`. This asymmetry is real and is documented here on purpose.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Data plane (chat, embeddings, models, health, metrics)
  - url: http://localhost:8081
    description: Admin API (loopback by default)
tags:
  - name: OpenAI compatibility
    description: OpenAI-compatible data plane endpoints.
  - name: Health
    description: Probe and per-provider health endpoints on the public listener.
  - name: Admin
    description: Control plane operations, served on the admin listener.
  - name: Observability
    description: Prometheus exposition on the public listener.

paths:
  /v1/chat/completions:
    post:
      tags: [OpenAI compatibility]
      operationId: createChatCompletion
      summary: Create a chat completion (JSON or SSE)
      description: |
        Resolves the model to a provider, applies rate limit / budget / cache,
        then calls the provider with retry, circuit breaker and fallback.

        With `stream: true`, responds `200` with `text/event-stream`. Each event
        is `data: <StreamChunk>`; the stream ends with `data: [DONE]` **only**
        on a successful completion. A mid-stream provider failure emits
        `event: error` and then closes **without** `[DONE]`; an upstream close
        without a terminal `finish_reason`/usage emits `event: error` with
        `code: "stream_truncated"`, also without `[DONE]`. Streams are never
        cached and cannot be resumed.

        If all providers fail before a stream starts, the gateway responds with
        the mapped status (`400`/`404`/`413`/`429`/`502`/`503`/`504`) and never
        starts SSE. `Retry-After` is propagated, rounded up to seconds.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Completion (JSON) or SSE stream.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Gateway-Provider:
              $ref: '#/components/headers/X-Gateway-Provider'
            X-Cache:
              $ref: '#/components/headers/X-Cache'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamChunk'
                description: |
                  Each `data:` line carries this JSON object, except the
                  terminal `data: [DONE]` (success only) and `event: error`
                  frames, which carry an `ErrorResponse`. See the operation
                  description for the framing rules.

                  Wire example:

                  ```
                  data: {"id":"chatcmpl-1","object":"chat.completion.chunk","created":1760000000,"model":"gpt-4o","choices":[{"index":0,"delta":{"role":"assistant","content":"Hi"},"finish_reason":null}]}

                  data: [DONE]
                  ```
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/embeddings:
    post:
      tags: [OpenAI compatibility]
      operationId: createEmbeddings
      summary: Create embeddings
      description: |
        Accepts a string or an array of strings. The gateway routes to an
        `Embedder` provider (OpenAI or Gemini in this version). Exact-response
        caching applies when enabled; embeddings are not streamed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Embedding vector(s).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Gateway-Provider:
              $ref: '#/components/headers/X-Gateway-Provider'
            X-Cache:
              $ref: '#/components/headers/X-Cache'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/models:
    get:
      tags: [OpenAI compatibility]
      operationId: listModels
      summary: List models declared by configured providers
      description: |
        Returns the union of `providers.<name>.models` after wildcard and
        auto-discovery handling. It is a configured registry, not a live
        upstream catalogue.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Model list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness and uptime (always 200 while the process is alive)
      description: |
        Returns gateway metadata. `ready` flips to false during graceful drain,
        but this endpoint (and `/livez`) still returns 200.
      security: []
      responses:
        '200':
          description: Gateway status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/providers:
    get:
      tags: [Health]
      operationId: getProviderHealth
      summary: Per-provider health fan-out
      description: |
        Checks providers in parallel with `health.provider_timeout` and an
        overall `health.check_timeout`. Returns 200 even when `overall` is
        `degraded`. With `health.skip_expensive_checks`, Anthropic is reported
        as `skipped`; this still degrades the aggregate because the aggregate
        requires every status to be `healthy`.
      security: []
      responses:
        '200':
          description: Map of provider name to status, plus optional `overall`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHealthMap'
  /livez:
    get:
      tags: [Health]
      operationId: getLivez
      summary: Kubernetes liveness probe
      description: Alias of `/health`; returns 200 while the process is alive.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Kubernetes readiness probe
      description: |
        Returns 503 while draining, or when zero providers are healthy.
        Provider results are cached for `health.readiness_cache_ttl`
        (15s default, 30s in the production profile). `skipped` counts as
        healthy here.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Draining or no healthy provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /metrics:
    get:
      tags: [Observability]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Prometheus text exposition. This endpoint is intentionally not covered
        by tenant auth; restrict it at the network layer. Metric names include
        `gateway_requests_total`, `gateway_request_duration_seconds`,
        `gateway_tokens_total`, `gateway_cost_usd_total`,
        `gateway_provider_errors_total`, `gateway_circuit_state`,
        `gateway_cache_hits_total`, `gateway_cache_size`,
        `gateway_capability_mismatches_total` and
        `gateway_idempotency_requests_total`.
      security: []
      responses:
        '200':
          description: Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string
  /admin/config:
    get:
      tags: [Admin]
      operationId: getAdminConfig
      summary: Read the current configuration (secrets redacted)
      description: |
        Returns a YAML-round-tripped copy of the in-memory config as JSON.
        Provider keys, the admin key, auth keys and the Redis URL are replaced
        with `***`. Because the Go structs have no JSON tags, keys are the Go
        field names (for example `Admin.APIKey`) and durations are integer
        nanoseconds.
      servers:
        - url: http://localhost:8081
          description: Admin API
      security:
        - adminBearer: []
        - adminHeader: []
      responses:
        '200':
          description: Redacted config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConfig'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '503':
          $ref: '#/components/responses/AdminDisabled'
    patch:
      tags: [Admin]
      operationId: patchAdminConfig
      summary: Apply hot-reloadable knobs
      description: |
        Applies a partial patch to the current in-memory configuration,
        validates it, then swaps live state (registry, limiter, budget, cache,
        auth, health, resilience). On any validation or apply error the old
        configuration stays active and the response is `400`.

        Not hot-reloadable: `admin.port`, `admin.bind_address`, `admin.api_key`,
        `admin.pprof_enabled`, `server.*`. Those require a restart.
      servers:
        - url: http://localhost:8081
          description: Admin API
      security:
        - adminBearer: []
        - adminHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPatch'
      responses:
        '200':
          description: Patch applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionStatus'
        '400':
          $ref: '#/components/responses/AdminBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/reload:
    post:
      tags: [Admin]
      operationId: postAdminReload
      summary: Reload the config file
      description: |
        Re-reads the process's `-config` file, validates it, rebuilds providers,
        pricing, Redis and live state. On failure returns `400` and keeps the
        previous configuration. `SIGHUP` and the 1s file watcher use the same
        apply path.
      servers:
        - url: http://localhost:8081
          description: Admin API
      security:
        - adminBearer: []
        - adminHeader: []
      responses:
        '200':
          description: Reloaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionStatus'
        '400':
          $ref: '#/components/responses/AdminBadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '503':
          $ref: '#/components/responses/AdminDisabled'
  /admin/providers:
    get:
      tags: [Admin]
      operationId: getAdminProviders
      summary: List configured providers and their models
      servers:
        - url: http://localhost:8081
          description: Admin API
      security:
        - adminBearer: []
        - adminHeader: []
      responses:
        '200':
          description: Providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProviders'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '503':
          $ref: '#/components/responses/AdminDisabled'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Tenant API key. Required when `auth.enabled` is true.
    adminBearer:
      type: http
      scheme: bearer
      description: Admin API key. The server also accepts the raw key in this header.
    adminHeader:
      type: apiKey
      in: header
      name: X-Admin-API-Key
      description: Alternative to the Bearer header for the admin API.

  headers:
    X-Request-ID:
      description: Request identifier (echoed or generated).
      schema:
        type: string
    X-Gateway-Provider:
      description: Provider that produced the response, or `cache` / `cache-semantic` on a hit.
      schema:
        type: string
    X-Cache:
      description: Cache result. Omitted when caching is disabled or for streams.
      schema:
        type: string
        enum: [HIT, MISS]
    Idempotent-Replayed:
      description: Present and `true` when this response was replayed from the Idempotency-Key store.
      schema:
        type: boolean
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    X-RateLimit-Limit:
      description: Request-per-minute limit for this bucket (only present on 429 from the request limiter).
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Remaining requests (always `0` on this 429 path).
      schema:
        type: integer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Opaque key scoped to the authenticated tenant and path. When
        `idempotency.enabled` is true, a successful response is stored and
        replayed for a byte-identical body. Reusing the key with a different
        body returns `409 idempotency_key_reuse`; a duplicate that arrives while
        the first request is still running waits up to
        `idempotency.wait_timeout`, then returns `409 idempotency_in_progress`.
        Streaming chat requests bypass the store.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x21-\x7E]+$'

  responses:
    BadRequest:
      description: |
        Invalid JSON, trailing JSON, missing `model`/`messages`, invalid input,
        or a request the provider could not represent (for example an
        `unsupported_parameter` with `param`). Unknown fields are tolerated by
        the data plane and do not produce this error.

        Also returned as `code: model_capability_mismatch` when the resolved
        model lacks a capability the request needs (tools, vision, audio,
        `json_schema`/`json_object`); this happens before any provider call.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidJSON:
              summary: Invalid JSON body
              value:
                error:
                  message: 'invalid JSON body: unexpected end of JSON input'
                  type: invalid_request_error
                  code: invalid_request_error
            unsupportedParameter:
              summary: Parameter cannot be represented by the selected provider
              value:
                error:
                  message: 'response_format.type: json_schema is not supported by this provider'
                  type: invalid_request_error
                  code: unsupported_parameter
                  param: response_format.type
            modelCapabilityMismatch:
              summary: The resolved model cannot serve tools/vision/structured output
              value:
                error:
                  message: 'model "claude-sonnet-4-6" on provider "anthropic" lacks required capabilities: tools'
                  type: invalid_request_error
                  code: model_capability_mismatch
                  param: tools
    Unauthorized:
      description: Missing/invalid/expired API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: invalid or expired API key
              type: invalid_request_error
              code: invalid_api_key
    Forbidden:
      description: The key lacks the required scope.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: '`Bearer error="insufficient_scope", scope="..."`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: 'API key is missing required scope: chat:write'
              type: insufficient_scope
              code: insufficient_scope
    Conflict:
      description: |
        `Idempotency-Key` reused with a different request body
        (`idempotency_key_reuse`), or a duplicate request arrived while the
        first one is still running and did not finish within
        `idempotency.wait_timeout` (`idempotency_in_progress`, with
        `Retry-After: 1`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            keyReuse:
              summary: Same key, different body
              value:
                error:
                  message: Idempotency-Key was already used with a different request body
                  type: invalid_request_error
                  code: idempotency_key_reuse
            inProgress:
              summary: First request is still running
              value:
                error:
                  message: a request with this Idempotency-Key is still in progress
                  type: invalid_request_error
                  code: idempotency_in_progress
    ModelNotFound:
      description: No configured provider serves the model.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: 'no provider configured: model "unknown"'
              type: model_not_found
              code: model_not_found
    PayloadTooLarge:
      description: Body exceeds 8 MiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: request body too large (max 8MiB)
              type: invalid_request_error
              code: invalid_request_error
    RateLimited:
      description: |
        `rate_limit_exceeded` (local request/token bucket), `insufficient_quota`
        (monthly budget), or an upstream 429 after fallbacks are exhausted.
        `Retry-After` is set for the limiter path and for an upstream 429
        (rounded up to a whole second, minimum 1); `X-RateLimit-*` headers are
        set only by the request limiter.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimit:
              value:
                error:
                  message: rate limit exceeded, retry later
                  type: rate_limit_exceeded
                  code: rate_limit_exceeded
            tokenLimit:
              value:
                error:
                  message: token budget exceeded, retry later
                  type: rate_limit_exceeded
                  code: rate_limit_exceeded
            quota:
              value:
                error:
                  message: 'insufficient_quota: monthly budget reservation denied'
                  type: insufficient_quota
                  code: insufficient_quota
            upstream:
              value:
                error:
                  message: '[openai] rate limit exceeded'
                  type: rate_limit_error
                  code: rate_limit_exceeded
    ProviderError:
      description: |
        All providers failed, or the primary and fallbacks returned retryable
        errors. An upstream 5xx/network failure maps here as `502`; an upstream
        401/403 also maps to `502` without echoing the provider body.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: '[openai] upstream overloaded (HTTP 503)'
              type: provider_error
              code: provider_error
    ServiceUnavailable:
      description: |
        Budget backend unavailable (`budget_unavailable` when
        `require_shared_store` is set), price missing under `reject` policy
        (`pricing_unavailable`), an upstream 503/504 after fallbacks
        (`provider_unavailable`), or admin key not configured on the admin
        listener.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            budget:
              value:
                error:
                  message: budget service temporarily unavailable
                  type: budget_unavailable
                  code: budget_unavailable
            pricing:
              value:
                error:
                  message: provider/model price is not configured
                  type: pricing_unavailable
                  code: pricing_unavailable
            provider:
              value:
                error:
                  message: '[anthropic] provider unavailable'
                  type: provider_error
                  code: provider_unavailable
    GatewayTimeout:
      description: The request context or provider call timed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: request timed out
              type: provider_error
              code: provider_error
    AdminUnauthorized:
      description: Missing or invalid admin key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
          example:
            error: invalid admin api key
    AdminDisabled:
      description: Admin key is not configured and insecure mode is off (fail-closed).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
          example:
            error: admin api key is not configured
    AdminBadRequest:
      description: Invalid patch, validation failure, or reload failure. Previous config remains active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
          example:
            error: 'validation failed: rate_limit.burst must be > 0 when enabled'

  schemas:
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      description: |
        Unknown fields are accepted and ignored, mirroring OpenAI's evolving
        schema. The gateway only requires `model` and a non-empty `messages`.
      properties:
        model:
          type: string
          description: Model name as declared by a provider (exact, glob or alias).
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          description: Forwarded to the provider; not range-validated by the gateway.
        max_tokens:
          type: integer
          description: Forwarded to the provider.
        max_completion_tokens:
          type: integer
          description: Takes precedence over `max_tokens` when both are set.
        top_p:
          type: number
        presence_penalty:
          type: number
        frequency_penalty:
          type: number
        logprobs:
          type: boolean
        top_logprobs:
          type: integer
        seed:
          type: integer
        stream:
          type: boolean
          default: false
        stream_options:
          $ref: '#/components/schemas/StreamOptions'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        tool_choice:
          $ref: '#/components/schemas/ToolChoice'
        parallel_tool_calls:
          type: boolean
        response_format:
          $ref: '#/components/schemas/ResponseFormat'
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        n:
          type: integer
          description: Forwarded to the provider; not validated by the gateway.
        user:
          type: string
        service_tier:
          type: string
        reasoning_effort:
          type: string
        modalities:
          type: array
          items:
            type: string
        audio:
          $ref: '#/components/schemas/AudioRequest'
    ChatMessage:
      type: object
      required: [role]
      additionalProperties: true
      description: |
        OpenAI message shape. Unknown message fields are tolerated and ignored
        by the data plane. `content` may be a string, an array of content parts,
        or null (for assistant tool calls).
      properties:
        role:
          type: string
          description: '`system`, `user`, `assistant`, `tool` or `developer`; forwarded, provider support varies.'
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentPart'
            - type: 'null'
        name:
          type: string
        tool_call_id:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        function_call:
          $ref: '#/components/schemas/FunctionCall'
        audio:
          $ref: '#/components/schemas/Audio'
        refusal:
          type: string
    ContentPart:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: '`text`, `image_url` or `input_audio` in OpenAI; forwarded.'
        text:
          type: string
        image_url:
          $ref: '#/components/schemas/ImageURL'
        input_audio:
          $ref: '#/components/schemas/InputAudio'
    ImageURL:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
        detail:
          type: string
          description: '`auto`, `low` or `high`; forwarded.'
    InputAudio:
      type: object
      required: [data, format]
      additionalProperties: false
      properties:
        data:
          type: string
          description: Base64-encoded audio.
        format:
          type: string
    Tool:
      type: object
      required: [type, function]
      additionalProperties: false
      properties:
        type:
          type: string
          description: Only `function` is meaningful in this version.
        function:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              type: object
              additionalProperties: true
              description: JSON Schema for the function arguments.
    ToolChoice:
      oneOf:
        - type: string
          description: '`none`, `auto` or `required`; forwarded, not validated.'
        - type: object
          required: [type, function]
          additionalProperties: false
          properties:
            type:
              type: string
            function:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
    ResponseFormat:
      type: object
      required: [type]
      additionalProperties: false
      description: |
        `type` selects text, JSON object or JSON schema output. For
        `json_schema`, the `json_schema` object is passed through verbatim
        (including the caller's `name`, `strict` and `schema`) to providers
        that support it. Values are not validated against an enum; a provider
        that cannot represent the type returns `400 unsupported_parameter`.
      properties:
        type:
          type: string
        json_schema:
          type: object
          additionalProperties: true
          description: 'Pass-through JSON Schema envelope for type: json_schema.'
        strict:
          type: boolean
    StreamOptions:
      type: object
      additionalProperties: false
      properties:
        include_usage:
          type: boolean
          description: Emit provider usage in the final SSE chunk when available.
    ToolCall:
      type: object
      required: [id, type, function]
      additionalProperties: false
      properties:
        index:
          type: integer
          description: |
            Position of the tool call in the assistant message or in the
            streamed delta. Emitted by provider translation and stream deltas;
            clients normally send it only in assistant history.
        id:
          type: string
        type:
          type: string
        function:
          $ref: '#/components/schemas/FunctionCall'
    FunctionCall:
      type: object
      required: [name, arguments]
      additionalProperties: false
      properties:
        name:
          type: string
        arguments:
          type: string
          description: JSON-encoded arguments (string, as in OpenAI).
    Audio:
      type: object
      properties:
        id:
          type: string
        data:
          type: string
        transcript:
          type: string
        expires_at:
          type: integer
    AudioRequest:
      type: object
      required: [voice, format]
      additionalProperties: false
      properties:
        voice:
          type: string
        format:
          type: string
    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
        usage:
          $ref: '#/components/schemas/Usage'
        system_fingerprint:
          type: string
        service_tier:
          type: string
    Choice:
      type: object
      required: [index, message, finish_reason]
      properties:
        index:
          type: integer
        message:
          $ref: '#/components/schemas/ResponseMessage'
        finish_reason:
          oneOf:
            - type: string
            - type: 'null'
        logprobs:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
    ResponseMessage:
      type: object
      required: [role]
      properties:
        role:
          type: string
        content:
          oneOf:
            - type: string
            - type: 'null'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        function_call:
          $ref: '#/components/schemas/FunctionCall'
        audio:
          $ref: '#/components/schemas/Audio'
        refusal:
          type: string
    Usage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        prompt_tokens_details:
          type: object
          description: Provider-reported prompt breakdown (cache hits).
          properties:
            cached_tokens:
              type: integer
        completion_tokens_details:
          type: object
          description: Provider-reported completion breakdown (reasoning tokens).
          properties:
            reasoning_tokens:
              type: integer
    StreamChunk:
      type: object
      description: SSE `data:` payload.
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion.chunk
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            required: [index, delta]
            properties:
              index:
                type: integer
              delta:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
                  tool_calls:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolCall'
              finish_reason:
                oneOf:
                  - type: string
                  - type: 'null'
        usage:
          $ref: '#/components/schemas/Usage'
        system_fingerprint:
          type: string
    EmbeddingRequest:
      type: object
      required: [model, input]
      additionalProperties: false
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              items:
                type: string
        encoding_format:
          type: string
          description: Forwarded to the provider; not validated by the gateway.
        dimensions:
          type: integer
          description: Forwarded to the provider; not validated by the gateway.
        user:
          type: string
    EmbeddingResponse:
      type: object
      required: [object, data, model, usage]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            required: [object, index, embedding]
            properties:
              object:
                type: string
                const: embedding
              index:
                type: integer
              embedding:
                type: array
                items:
                  type: number
                  format: float
        model:
          type: string
        usage:
          type: object
          required: [prompt_tokens, total_tokens]
          properties:
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer
    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            required: [id, object, created, owned_by]
            properties:
              id:
                type: string
              object:
                type: string
                const: model
              created:
                type: integer
              owned_by:
                type: string
    Health:
      type: object
      required: [status, uptime_seconds, start_time, ready]
      properties:
        status:
          type: string
          const: ok
        uptime_seconds:
          type: number
        start_time:
          type: string
          format: date-time
        ready:
          type: boolean
    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready, draining]
        ready:
          type: boolean
          description: Present only in the draining response.
        healthy:
          type: integer
        total:
          type: integer
        providers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ProviderStatus'
    ProviderStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, skipped]
        error:
          type: string
    ProviderHealthMap:
      type: object
      description: |
        Map of provider name to ProviderStatus, plus `overall` when degraded.
        Because `overall` is a string and the other values are objects, this
        schema is intentionally loose; the example is authoritative.
      additionalProperties: true
      example:
        openai:
          status: healthy
        anthropic:
          status: skipped
        overall: degraded
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
            param:
              type: string
              description: |
                Offending request field for `unsupported_parameter` and
                translation errors. Omitted when the failure is not tied to a
                parameter.
    AdminError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AdminActionStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [reloaded, patched]
    AdminConfig:
      type: object
      description: |
        JSON encoding of the Go config structs. Field names are capitalized and
        durations are integer nanoseconds. Secrets are replaced by `***`.
      additionalProperties: true
      example:
        Server:
          Port: 8080
          ReadTimeout: 30000000000
          WriteTimeout: 60000000000
        Providers:
          openai:
            APIKey: '***'
            BaseURL: https://api.openai.com/v1
            Timeout: 30000000000
            Models: [gpt-4o]
        Admin:
          Port: 8081
          BindAddress: 127.0.0.1
          APIKey: '***'
          AllowInsecure: false
          PprofEnabled: false
        RateLimit:
          RedisURL: '***'
    AdminPatch:
      type: object
      additionalProperties: false
      description: Partial update; only present fields are applied. Durations are strings (`30s`, `5m`).
      properties:
        rate_limit:
          type: object
          additionalProperties: false
          properties:
            requests_per_minute:
              type: integer
              minimum: 0
            burst:
              type: integer
              minimum: 0
            tokens_per_minute:
              type: integer
              minimum: 0
              description: Token-bucket refill rate (tokens per minute).
            token_burst:
              type: integer
              minimum: 0
              description: Token-bucket capacity in tokens (>= 1024 when enabled).
            redis_url:
              type: string
        cache:
          type: object
          additionalProperties: false
          properties:
            ttl:
              type: string
            max_ttl:
              type: string
              description: Upper bound for X-Cache-TTL (max 24h).
            max_size:
              type: integer
              minimum: 0
            max_bytes:
              type: integer
              minimum: 0
              description: Byte budget for the in-memory cache.
            semantic_enabled:
              type: boolean
            semantic_threshold:
              type: number
              minimum: 0
              maximum: 1
            semantic_embedding_model:
              type: string
            semantic_top_k:
              type: integer
              minimum: 0
            semantic_max_entries:
              type: integer
              minimum: 0
        health:
          type: object
          additionalProperties: false
          properties:
            readiness_cache_ttl:
              type: string
            check_timeout:
              type: string
            provider_timeout:
              type: string
            skip_expensive_checks:
              type: boolean
        resilience:
          type: object
          additionalProperties: false
          properties:
            retry:
              type: object
              additionalProperties: false
              properties:
                max_attempts:
                  type: integer
                  minimum: 0
                base_delay:
                  type: string
                max_delay:
                  type: string
            circuit:
              type: object
              additionalProperties: false
              properties:
                failure_threshold:
                  type: integer
                  minimum: 0
                open_timeout:
                  type: string
            hedge:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                delay:
                  type: string
        routing:
          type: object
          additionalProperties: false
          properties:
            weighted:
              type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  required: [provider, weight]
                  additionalProperties: false
                  properties:
                    provider:
                      type: string
                    name:
                      type: string
                      description: Alias for `provider`.
                    weight:
                      type: integer
                      minimum: 1
        logging:
          type: object
          additionalProperties: false
          properties:
            level:
              type: string
              enum: [debug, info, warn, error]
            format:
              type: string
              enum: [json, text]
    AdminProviders:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [name, models]
            properties:
              name:
                type: string
              base_url:
                type: string
                description: Present but empty in this version; the code populates only name, models and capabilities.
              models:
                type: array
                items:
                  type: string
              capabilities:
                type: object
                description: Effective capability set per concrete model. Omitted when the registry has no capability metadata.
                additionalProperties:
                  $ref: '#/components/schemas/ModelCapabilities'
    ModelCapabilities:
      type: object
      description: |
        Capabilities enforced before dispatch and during fallback. Provider-kind
        defaults are refined by `providers.<name>.capabilities` overrides.
      required: [chat, stream, tools, parallel_tools, vision, audio, json_object, json_schema, embeddings]
      properties:
        chat:
          type: boolean
        stream:
          type: boolean
        tools:
          type: boolean
        parallel_tools:
          type: boolean
        vision:
          type: boolean
        audio:
          type: boolean
        json_object:
          type: boolean
        json_schema:
          type: boolean
        embeddings:
          type: boolean
        context_window:
          type: integer
          description: Advisory context window in tokens (0/omitted means unknown).
        max_output:
          type: integer
          description: Advisory maximum output tokens (0/omitted means unknown).
