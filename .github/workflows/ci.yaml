name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more override this block.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  # Line coverage floor measured with -coverpkg=./... (current baseline ~58%).
  COVERAGE_MIN: "55"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Available to current and future tests through REDIS_URL. Tests that
      # need a real server should be guarded by //go:build integration.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download deps
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test with race and package-wide coverage
        run: go test ./... -count=1 -race -coverpkg=./... -coverprofile=coverage.out
      - name: Enforce coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total coverage with -coverpkg=./...: ${total}% (minimum ${COVERAGE_MIN}%)"
          echo "### Coverage: ${total}% (minimum ${COVERAGE_MIN}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v total="$total" -v min="$COVERAGE_MIN" 'BEGIN {
            if (total + 0 < min + 0) {
              printf "coverage %.1f%% is below the %s%% floor\n", total, min > "/dev/stderr"
              exit 1
            }
          }'
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint (v2 config)
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.15.0
          only-new-issues: false
          timeout: 5m
          args: --timeout=5m

  vulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck (advisory while deps are upgraded)
        id: govulncheck
        # Known called vulnerabilities come from the pinned module graph and
        # Go stdlib (owned by the Go/dependency workstream). Report them, but
        # do not block CI on findings this workstream cannot fix.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Surface govulncheck findings
        if: steps.govulncheck.outcome == 'failure'
        run: |
          echo "::warning title=govulncheck::Called vulnerabilities found in Go modules/stdlib; upgrade dependencies to make this gate blocking again."
          echo "### govulncheck: findings (advisory)" >> "$GITHUB_STEP_SUMMARY"

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Integration tests are opt-in: add `//go:build integration` to a test
      # file and it runs here against the Redis service. Until such tests
      # exist this job is green and reports the skip explicitly.
      - name: Detect integration tests
        id: detect
        run: |
          if grep -rqE '^//go:build .*\bintegration\b' --include='*_test.go' .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No //go:build integration tests yet; nothing to run."
          fi
      - name: Run integration tests
        if: steps.detect.outputs.found == 'true'
        run: go test -tags=integration ./... -count=1 -race -v

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint, vulncheck]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: llm-api-gateway:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (OS packages, blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-api-gateway:ci
          format: table
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Go module/stdlib findings are reported but not blocking while the
      # dependency upgrade is owned elsewhere. Flip exit-code to 1 once
      # go.mod is upgraded and this scan is clean.
      - name: Trivy Go modules report (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: llm-api-gateway:ci
          format: table
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (syft via anchore)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: llm-api-gateway:ci
          format: spdx-json
          output-file: sbom-ci.spdx.json
          artifact-name: sbom-ci.spdx.json
          upload-artifact: true
