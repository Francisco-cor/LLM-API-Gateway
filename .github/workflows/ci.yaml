name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more override this block.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  # Line coverage floor measured with -coverpkg=./... (current baseline ~66%).
  COVERAGE_MIN: "55"

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      # Available to current and future tests through REDIS_URL. Tests that
      # need a real server should be guarded by //go:build integration.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download deps
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test with race and package-wide coverage
        run: go test ./... -count=1 -race -coverpkg=./... -coverprofile=coverage.out
      - name: Enforce coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total coverage with -coverpkg=./...: ${total}% (minimum ${COVERAGE_MIN}%)"
          echo "### Coverage: ${total}% (minimum ${COVERAGE_MIN}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v total="$total" -v min="$COVERAGE_MIN" 'BEGIN {
            if (total + 0 < min + 0) {
              printf "coverage %.1f%% is below the %s%% floor\n", total, min > "/dev/stderr"
              exit 1
            }
          }'
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint (v2 config)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          only-new-issues: false
          args: --timeout=5m

  openapi:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint OpenAPI contract (zero warnings)
        # The spec is reviewed surface, so warnings are failures here. Pin the
        # image by digest; keep the tag for human readability.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            redocly/cli:2.78.0@sha256:ab4ca2d6d1cfb316677b79ae6462132a7e4c496037b7eb405ca7d3818fe9346d \
            lint api/openapi.yaml --max-problems 0
      - name: Detect breaking OpenAPI changes
        # Comparison baseline: the PR base branch, or the previous commit on a
        # direct push. Intentional breaks must carry the explicit marker.
        env:
          BASE_REF: ${{ github.base_ref }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            base_desc="origin/$BASE_REF"
          elif git rev-parse --verify -q HEAD^ >/dev/null; then
            base_desc="HEAD^"
          else
            echo "No base revision available; skipping the breaking-change check."
            exit 0
          fi

          if ! git cat-file -e "$base_desc:api/openapi.yaml" 2>/dev/null; then
            echo "No api/openapi.yaml at $base_desc; skipping the breaking-change check."
            exit 0
          fi

          git show "$base_desc:api/openapi.yaml" > "$RUNNER_TEMP/openapi-base.yaml"
          if cmp -s "$RUNNER_TEMP/openapi-base.yaml" api/openapi.yaml; then
            echo "api/openapi.yaml is unchanged vs $base_desc."
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/base"
          mv "$RUNNER_TEMP/openapi-base.yaml" "$RUNNER_TEMP/base/openapi.yaml"
          echo "Comparing api/openapi.yaml against $base_desc."

          set +e
          docker run --rm \
            -v "$PWD/api:/head:ro" \
            -v "$RUNNER_TEMP/base:/base:ro" \
            tufin/oasdiff:v1.37.0@sha256:ff02af37a254b5199b9d72e7bba93dae5837a9119d59459168d1398893b47aea \
            breaking --fail-on ERR --format githubactions \
            /base/openapi.yaml /head/openapi.yaml
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s\n%s\n%s' "$PR_TITLE" "$PR_BODY" "$COMMIT_MESSAGE" | grep -qF '[openapi-breaking-approved]'; then
            echo "::warning::Breaking OpenAPI changes accepted via the [openapi-breaking-approved] marker."
            exit 0
          fi
          echo "::error::Breaking OpenAPI change detected. Only add [openapi-breaking-approved] to the PR title/body or commit message when the break is intentional."
          exit "$status"

  vulncheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck (blocking)
        # Go 1.26.11 and the upgraded module graph are clean; keep this gate
        # blocking so a reachable vulnerability fails the build.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Redis-backed tests are skipped when REDIS_URL is unreachable; the
      # gateway smoke tests run unconditionally. REDIS_URL points at the
      # service container above.
      - name: Run integration tests
        run: go test -tags=integration ./tests/integration/... -count=1 -race -v

  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build gateway
        run: go build -trimpath -o bin/gateway ./cmd/gateway
      - name: Official OpenAI SDK conformance (Python + Node)
        # Versions are pinned in tests/conformance/run.sh. The upstream is a
        # stdlib fake; the gateway binary is the real data plane.
        run: ./tests/conformance/run.sh

  docker:
    runs-on: ubuntu-24.04
    needs: [test, lint, vulncheck]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: llm-api-gateway:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (OS packages, blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-api-gateway:ci
          format: table
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # The Go module graph is upgraded and govulncheck is clean, so library
      # findings are blocking too.
      - name: Trivy Go modules scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-api-gateway:ci
          format: table
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (syft via anchore)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: llm-api-gateway:ci
          format: spdx-json
          output-file: sbom-ci.spdx.json
          artifact-name: sbom-ci.spdx.json
          upload-artifact: true
