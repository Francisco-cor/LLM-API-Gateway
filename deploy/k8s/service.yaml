apiVersion: v1
kind: Service
metadata:
  name: llm-api-gateway
  labels:
    app: llm-api-gateway
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  selector:
    app: llm-api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: admin
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: pprof
      port: 6060
      targetPort: 6060
      protocol: TCP
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: llm-api-gateway-admin
  labels:
    app: llm-api-gateway
spec:
  selector:
    app: llm-api-gateway
  ports:
    - name: admin
      port: 8081
      targetPort: 8081
      protocol: TCP
  type: ClusterIP
