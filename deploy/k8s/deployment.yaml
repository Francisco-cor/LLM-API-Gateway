apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-api-gateway
  labels:
    app: llm-api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llm-api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: llm-api-gateway
      # No prometheus.io/* annotations: metrics are scraped through the
      # ServiceMonitor, and keeping both causes double scraping.
    spec:
      serviceAccountName: llm-api-gateway
      automountServiceAccountToken: false
      # Must stay >= the app's shutdown drain window so in-flight requests and
      # the readiness flip can complete before SIGKILL.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: llm-api-gateway
      containers:
        - name: gateway
          # TODO(supply-chain): pin by digest, e.g.
          #   image: ghcr.io/fcordero/llm-api-gateway@sha256:<digest>
          image: llm-api-gateway:latest
          imagePullPolicy: IfNotPresent
          # The ConfigMap is mounted as a directory (no subPath) so the file
          # watcher can reload it in place. Rollout is not required for config
          # edits; secret changes still require a pod restart.
          command: ["./gateway"]
          args: ["-config", "/app/config/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 8081
              protocol: TCP
          env:
            # Strict validation: auth, admin key, TLS-only base URLs, Redis.
            - name: GATEWAY_ENV
              value: "prod"
            # Used for the multi-replica budget warning (HPA minReplicas).
            - name: GATEWAY_REPLICAS
              value: "3"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: openai-api-key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: anthropic-api-key
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: gemini-api-key
                  optional: true
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: gateway-api-key
                  optional: false
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: redis-url
                  optional: true
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secrets
                  key: admin-api-key
                  optional: false
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-collector.observability.svc.cluster.local:4317"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /cache
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: llm-gateway-config
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
