# Example only. Copy to secret.yaml (git-ignored), replace every value and
# create it with `kubectl apply -n <namespace> -f secret.yaml`.
# The name intentionally differs from the Secret consumed by the Deployment so
# applying kustomize can never start the gateway with placeholder credentials.
apiVersion: v1
kind: Secret
metadata:
  name: llm-gateway-secrets-example
  labels:
    app: llm-api-gateway
type: Opaque
stringData:
  openai-api-key: "replace-me"
  anthropic-api-key: "replace-me"
  gemini-api-key: "replace-me"
  gateway-api-key: "replace-me"
  admin-api-key: "replace-me"
  redis-url: "redis://redis.data.svc.cluster.local:6379/0"
