apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  labels:
    app: llm-api-gateway
data:
  config.yaml: |
    server:
      port: 8080
      read_timeout: 30s
      write_timeout: 60s
    providers:
      openai:
        api_key: ${OPENAI_API_KEY}
        base_url: https://api.openai.com/v1
        timeout: 30s
        models: ["gpt-4o","gpt-4o-mini"]
      anthropic:
        api_key: ${ANTHROPIC_API_KEY}
        base_url: https://api.anthropic.com
        timeout: 30s
        models: ["claude-sonnet-4-6"]
      gemini:
        api_key: ${GEMINI_API_KEY}
        base_url: https://generativelanguage.googleapis.com/v1beta
        timeout: 30s
        models: ["gemini-2.5-pro"]
    fallback_chain: ["openai","anthropic","gemini"]
    rate_limit:
      enabled: true
      requests_per_minute: 600
      burst: 100
      token_aware: true
      budget:
        enabled: true
        monthly_tokens: 1000000
        monthly_usd: 100.0
        cost_per_token_usd: 0.00001
        pricing:
          currency: USD
          version: "2026-09"
          unknown_model_policy: fallback
          catalog:
            - provider: openai
              model: gpt-4o
              input_per_million_tokens_usd: 5.0
              output_per_million_tokens_usd: 15.0
            - provider: openai
              model: text-embedding-3-small
              embedding_per_million_tokens_usd: 0.02
    auth:
      enabled: true
      keys:
        - key: ${GATEWAY_API_KEY}
          tenant: default
          scopes: ["chat:write", "embeddings:write", "models:read"]
    cache:
      enabled: false
      ttl: 5m
      max_size: 1000
    resilience:
      retry:
        max_attempts: 3
        base_delay: 200ms
        max_delay: 2s
      circuit:
        failure_threshold: 5
        open_timeout: 30s
      hedge:
        enabled: false
        delay: 300ms
    logging:
      level: info
      format: json
    admin:
      port: 8081
      api_key: ${ADMIN_API_KEY}
