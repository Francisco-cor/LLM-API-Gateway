apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-api-gateway
  labels:
    app: llm-api-gateway
spec:
  # Coherent with HPA minReplicas=3: at least one pod can always be evicted
  # while two remain serving.
  minAvailable: 2
  selector:
    matchLabels:
      app: llm-api-gateway
