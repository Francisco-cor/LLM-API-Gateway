apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-api-gateway
  labels:
    app: llm-api-gateway
    release: prometheus
spec:
  selector:
    matchLabels:
      app: llm-api-gateway
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
      honorLabels: true
  namespaceSelector:
    matchNames:
      - default
