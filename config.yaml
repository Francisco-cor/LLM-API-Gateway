# Gateway configuration.
#
# Zero means "use the built-in default" for every optional numeric duration or
# limit below (retry attempts/delays, circuit threshold/timeout, cache sizes and
# TTLs, rate limits, health timeouts, budget reservation_ttl). A YAML scalar
# cannot express "absent", so an explicit 0 is the same as omitting the field.
# Negative values are rejected at load time.
#
# Hot reload (SIGHUP, admin PATCH, file watcher) applies auth, CORS, logging
# level, provider keys, rate limits, cache, resilience and the admin API key.
# The HTTP bind address/port, admin bind/port, admin.pprof_enabled and
# logging.format require a restart and are rejected with a clear error.
server:
  port: 8080
  read_timeout: 30s
  write_timeout: 60s

providers:
  openai:
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    timeout: 30s
    models:
      - gpt-4o
      - gpt-4o-mini
      - text-embedding-3-small
      - text-embedding-3-large
      # Wildcard example: uncomment to use pattern matching
      # - "gpt-4*"
    # models: []  # leave empty to enable auto-discovery via GET /v1/models (Fase 8)
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    base_url: https://api.anthropic.com
    timeout: 30s
    models:
      - claude-opus-4-8
      - claude-sonnet-4-6
      - claude-haiku-4-5-20251001
      # Wildcard: e.g. "claude-*"
  gemini:
    api_key: ${GEMINI_API_KEY}
    base_url: https://generativelanguage.googleapis.com/v1beta
    timeout: 30s
    models:
      - gemini-2.5-flash
      - gemini-2.5-pro
      - text-embedding-004
      - embedding-001
      # Wildcard: "gemini-*" matches gemini-2.5-flash, gemini-2.5-pro, etc.

fallback_chain:
  - openai
  - anthropic
  - gemini

model_aliases:
  # When primary model fails, remap to fallback's equivalent
  # gpt-4o: ["claude-sonnet-4-6", "gemini-2.5-pro"]
  # claude-sonnet-4-6: ["gpt-4o", "gemini-2.5-flash"]

# Fase 8: intelligent routing — weighted/canary + wildcard/regex
routing:
  weighted:
    # Example canary: 90% openai, 10% anthropic for gpt-4o
    # gpt-4o:
    #   - provider: openai
    #     weight: 90
    #   - provider: anthropic
    #     weight: 10
    # Wildcard routing: provider models may contain "gpt-4*", "claude-*", "gemini-*"
    # Regex example: "gpt-4.*":  maps to same
    gpt-4o:
      - provider: openai
        weight: 100
    # Uncomment to enable explicit weighted split:
    # text-embedding-3-small:
    #   - provider: openai
    #     weight: 100

rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 10
  redis_url: ${REDIS_URL}
  token_aware: true
  tokens_per_minute: 60000
  token_burst: 10000
  overrides:
    # Example tier overrides
    # - tenant: pro-tenant
    #   model_pattern: "gpt-4*"
    #   rpm: 600
    #   burst: 60
    # - tenant: "*"
    #   model_pattern: "*"
    #   rpm: 60
    #   burst: 10
  budget:
    enabled: false
    monthly_tokens: 1000000
    monthly_usd: 100.0
    cost_per_token_usd: 0.00001
    # Fail closed when Redis is configured but unreachable instead of using
    # per-process accounting (3 replicas would otherwise get 3x the quota).
    require_shared_store: false
    # Uncommitted reservations release their quota after this lease.
    reservation_ttl: 10m
    pricing:
      currency: USD
      version: "2026-09"
      unknown_model_policy: fallback
      catalog:
        # Rates are USD per 1M tokens. Keep this list versioned with the
        # provider price snapshot used by finance/operations. Optional
        # cache_read/cache_write rates price prompt-cache hits and writes.
        - provider: openai
          model: gpt-4o
          input_per_million_tokens_usd: 5.0
          output_per_million_tokens_usd: 15.0
          # cache_read_per_million_tokens_usd: 2.5
          # cache_write_per_million_tokens_usd: 3.75
        - provider: openai
          model: text-embedding-3-small
          embedding_per_million_tokens_usd: 0.02
        # Wildcards are allowed for provider model families.
        # - provider: anthropic
        #   model: claude-sonnet-*
        #   input_per_million_tokens_usd: 3.0
        #   output_per_million_tokens_usd: 15.0

resilience:
  retry:
    max_attempts: 3
    base_delay: 200ms
    max_delay: 2s
  circuit:
    failure_threshold: 5
    open_timeout: 30s
  hedge:
    enabled: false
    delay: 300ms

cache:
  enabled: false
  ttl: 5m
  max_size: 1000
  # Byte budget for in-memory entries (0 uses the 64 MiB default). An
  # individual response larger than this is not cached.
  max_bytes: 67108864
  # Upper bound for X-Cache-TTL (0 disables the cap).
  max_ttl: 1h
  semantic_enabled: false
  semantic_threshold: 0.97
  # Semantic mode requires an embedding-capable configured provider.
  semantic_embedding_model: text-embedding-3-small
  semantic_top_k: 3
  semantic_max_entries: 1000

health:
  readiness_cache_ttl: 15s
  check_timeout: 10s
  provider_timeout: 3s
  # When true, readiness treats Anthropic as configured without spending a
  # messages request; /health/providers reports it as skipped.
  skip_expensive_checks: false

cors:
  allowed_origins: [] # e.g. ["https://app.example.com", "*"]

auth:
  enabled: false
  # Fail closed: when auth.enabled is true every key must declare at least one
  # scope from the allowlist (chat:write, embeddings:write, models:read,
  # admin:write, resource:<name>, *). Set require_scopes: false only for a key
  # that is meant to be denied everything.
  # require_scopes: true
  # Optional HMAC-SHA256 pepper for the in-memory key hashes. Prefer
  # AUTH_KEY_PEPPER in the environment over a literal value in this file.
  # key_pepper: ${AUTH_KEY_PEPPER}
  keys:
    # Example: uncomment and set GATEWAY_API_KEY or add more tenants
    # - key: ${GATEWAY_API_KEY}
    #   tenant: default
    #   scopes: ["chat:write", "models:read"]
    #   expires_at: 2027-01-01T00:00:00Z

logging:
  # level is reloadable (SIGHUP/admin PATCH).
  level: info
  # format requires a restart; a reload that changes it is rejected with a
  # warning and the current handler keeps running.
  format: json

admin:
  port: 8081
  bind_address: 127.0.0.1
  # api_key rotates live on reload. In production set ADMIN_API_KEY (or this
  # value) and allow_insecure: false; the admin API then fails closed.
  api_key: ${ADMIN_API_KEY} # set ADMIN_API_KEY env var to protect admin API
  allow_insecure: true # local dev only; set false in production
  # port, bind_address and pprof_enabled require a restart.
  pprof_enabled: false
