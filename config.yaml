server:
  port: 8080
  read_timeout: 30s
  write_timeout: 60s

providers:
  openai:
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    timeout: 30s
    models:
      - gpt-4o
      - gpt-4o-mini
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    base_url: https://api.anthropic.com
    timeout: 30s
    models:
      - claude-opus-4-8
      - claude-sonnet-4-6
      - claude-haiku-4-5-20251001
  gemini:
    api_key: ${GEMINI_API_KEY}
    base_url: https://generativelanguage.googleapis.com/v1beta
    timeout: 30s
    models:
      - gemini-2.5-flash
      - gemini-2.5-pro

fallback_chain:
  - openai
  - anthropic
  - gemini

model_aliases:
  # When primary model fails, remap to fallback's equivalent
  # gpt-4o: ["claude-sonnet-4-6", "gemini-2.5-pro"]
  # claude-sonnet-4-6: ["gpt-4o", "gemini-2.5-flash"]

rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 10

resilience:
  retry:
    max_attempts: 3
    base_delay: 200ms
    max_delay: 2s
  circuit:
    failure_threshold: 5
    open_timeout: 30s
  hedge:
    enabled: false
    delay: 300ms

cors:
  allowed_origins: [] # e.g. ["https://app.example.com", "*"]

auth:
  enabled: false
  keys:
    # Example: uncomment and set GATEWAY_API_KEY or add more tenants
    # - key: ${GATEWAY_API_KEY}
    #   tenant: default
    #   scopes: ["chat:write", "models:read"]
    #   expires_at: 2027-01-01T00:00:00Z

logging:
  level: info
  format: json
