server:
  port: 8080
  read_timeout: 30s
  write_timeout: 60s

providers:
  openai:
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    timeout: 30s
    models:
      - gpt-4o
      - gpt-4o-mini
      - text-embedding-3-small
      - text-embedding-3-large
      # Wildcard example: uncomment to use pattern matching
      # - "gpt-4*"
    # models: []  # leave empty to enable auto-discovery via GET /v1/models (Fase 8)
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    base_url: https://api.anthropic.com
    timeout: 30s
    models:
      - claude-opus-4-8
      - claude-sonnet-4-6
      - claude-haiku-4-5-20251001
      # Wildcard: e.g. "claude-*"
  gemini:
    api_key: ${GEMINI_API_KEY}
    base_url: https://generativelanguage.googleapis.com/v1beta
    timeout: 30s
    models:
      - gemini-2.5-flash
      - gemini-2.5-pro
      - text-embedding-004
      - embedding-001
      # Wildcard: "gemini-*" matches gemini-2.5-flash, gemini-2.5-pro, etc.

fallback_chain:
  - openai
  - anthropic
  - gemini

model_aliases:
  # When primary model fails, remap to fallback's equivalent
  # gpt-4o: ["claude-sonnet-4-6", "gemini-2.5-pro"]
  # claude-sonnet-4-6: ["gpt-4o", "gemini-2.5-flash"]

# Fase 8: intelligent routing — weighted/canary + wildcard/regex
routing:
  weighted:
    # Example canary: 90% openai, 10% anthropic for gpt-4o
    # gpt-4o:
    #   - provider: openai
    #     weight: 90
    #   - provider: anthropic
    #     weight: 10
    # Wildcard routing: provider models may contain "gpt-4*", "claude-*", "gemini-*"
    # Regex example: "gpt-4.*":  maps to same
    gpt-4o:
      - provider: openai
        weight: 100
    # Uncomment to enable explicit weighted split:
    # text-embedding-3-small:
    #   - provider: openai
    #     weight: 100

rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 10
  redis_url: ${REDIS_URL}
  token_aware: true
  overrides:
    # Example tier overrides
    # - tenant: pro-tenant
    #   model_pattern: "gpt-4*"
    #   rpm: 600
    #   burst: 60
    # - tenant: "*"
    #   model_pattern: "*"
    #   rpm: 60
    #   burst: 10
  budget:
    enabled: false
    monthly_tokens: 1000000
    monthly_usd: 100.0

resilience:
  retry:
    max_attempts: 3
    base_delay: 200ms
    max_delay: 2s
  circuit:
    failure_threshold: 5
    open_timeout: 30s
  hedge:
    enabled: false
    delay: 300ms

cache:
  enabled: false
  ttl: 5m
  max_size: 1000
  semantic_enabled: false
  semantic_threshold: 0.97

cors:
  allowed_origins: [] # e.g. ["https://app.example.com", "*"]

auth:
  enabled: false
  keys:
    # Example: uncomment and set GATEWAY_API_KEY or add more tenants
    # - key: ${GATEWAY_API_KEY}
    #   tenant: default
    #   scopes: ["chat:write", "models:read"]
    #   expires_at: 2027-01-01T00:00:00Z

logging:
  level: info
  format: json
